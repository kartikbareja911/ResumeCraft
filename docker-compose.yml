services:
  app:
    build: .
    image: resumecraft:latest
    container_name: resumecraft
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: "true"
    env_file:
      - path: ./backend/.env
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s